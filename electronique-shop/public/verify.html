<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vérification</title>
    <style>
        .spinner {
            width: 48px;
            height: 48px;
            border: 5px solid #ddd;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: tourner 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes tourner {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Vérification en cours...</p>
    </div>

    <h1 id="result" style="display: none;"></h1>
    <p id="redirect" style="display: none;">Redirection vers la page de connexion...</p>

    <script src="js/verify.js"></script>
</body>
</html>
